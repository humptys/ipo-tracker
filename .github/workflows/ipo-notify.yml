# IPOT: 매일 아침 공모주 알림을 핸드폰(ntfy)으로 예약 전송
# GitHub 예약 실행은 수십 분 늦을 수 있어서 06시대에 일찍 실행하고, 알림 시각은 ntfy 예약으로 맞춤
#   상장 08:58 · 청약 마감 15:30 · 일정/출금 08:30
name: ipo-notify

on:
  schedule:
    - cron: "7 21 * * *"    # UTC 21:07 = KST 06:07
  workflow_dispatch:
    inputs:
      test:
        description: "테스트 알림 보내기"
        type: boolean
        default: true
      delay_min:
        description: "테스트 알림을 몇 분 뒤로 예약할지 (0 = 바로)"
        type: number
        default: 0

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 상장일 알림
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RECORDS_TOKEN: ${{ secrets.RECORDS_TOKEN }}
          RECORDS_REPO: humptys/ipo-records
          RECORDS_PATH: ipo-tracker/records.json
          APP_URL: https://humptys.github.io/ipo-tracker/
          TEST: ${{ inputs.test && '1' || '' }}
          TEST_DELAY_MIN: ${{ inputs.delay_min }}
        run: python scripts/notify.py
